<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Sentences in Batch</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"></script>

    <style>
        .alert {
            display: none;
        }
        #preview-container {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none;
        }
        .preview-item {
            margin-bottom: 10px;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .theme-container {
            margin-bottom: 20px;
        }
        #newThemeInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Add New Sentences in Batch</h2>
            <a href="zinnen.html" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back to Sentences
            </a>
        </div>

        <div class="alert alert-success" id="success-alert" role="alert">
            <i class="fas fa-check-circle"></i> Sentences have been successfully added!
        </div>
        <div class="alert alert-danger" id="error-alert" role="alert">
            <i class="fas fa-exclamation-triangle"></i> <span id="error-message">An error occurred.</span>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <i class="fas fa-plus-circle"></i> Batch Sentence Addition
            </div>
            <div class="card-body">
                <form id="addSentencesForm">
                    <div class="mb-3 theme-container">
                        <label for="themeSelect" class="form-label">Theme:</label>
                        <div class="d-flex gap-2">
                            <select id="themeSelect" name="themeSelect" class="form-select">
                                <option value="">Select a theme</option>
                                <!-- Themes will be loaded dynamically -->
                            </select>
                            <button type="button" id="newThemeBtn" class="btn btn-outline-primary">
                                <i class="fas fa-plus"></i> New Theme
                            </button>
                        </div>
                        <input type="text" id="newThemeInput" name="newThemeInput" class="form-control mt-2" 
                               placeholder="Enter new theme name" style="display: none;">
                    </div>

                    <div class="mb-3">
                        <label for="sentencesInput" class="form-label">Sentences (one per line):</label>
                        <textarea id="sentencesInput" name="sentencesInput" class="form-control" rows="10" required
                                 placeholder="Enter your sentences here, one per line.
Example:
De man loopt naar huis.
Het regent buiten.
Ik hou van lezen."></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button type="button" id="previewBtn" class="btn btn-secondary">
                            <i class="fas fa-eye"></i> Preview
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Add Sentences
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="preview-container">
            <h4>Preview:</h4>
            <p>Theme: <span id="preview-theme"></span></p>
            <div id="preview-sentences">
                <!-- Preview sentences will be shown here -->
            </div>
            <p class="text-muted mt-3">Total sentences: <span id="sentence-count">0</span></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeSelect = document.getElementById('themeSelect');
            const newThemeBtn = document.getElementById('newThemeBtn');
            const newThemeInput = document.getElementById('newThemeInput');
            const sentencesInput = document.getElementById('sentencesInput');
            const previewBtn = document.getElementById('previewBtn');
            const previewContainer = document.getElementById('preview-container');
            const previewTheme = document.getElementById('preview-theme');
            const previewSentences = document.getElementById('preview-sentences');
            const sentenceCount = document.getElementById('sentence-count');
            const successAlert = document.getElementById('success-alert');
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            const addSentencesForm = document.getElementById('addSentencesForm');
            
            // Add session check at the beginning
            let UserLoggedId = null;
            let loggedInUser = null;
            
            // Check user session and redirect if not logged in
            checkSession();
            
            function checkSession() {
                var cookies = decodeURIComponent(document.cookie);
                var sessionCookie = cookies.split('; ').find(row => row.startsWith('sessionObject='));
                
                if (sessionCookie) {
                    var sessionData = JSON.parse(sessionCookie.split('=')[1]);
                    loggedInUser = sessionData.username;
                    UserLoggedId = sessionData.userId;
                    console.log("Logged in as", loggedInUser, "ID:", UserLoggedId);
                } else {
                    window.location.href = 'login.html';
                }
            }
            
            // Toggle between existing theme selection and new theme input
            let addingNewTheme = false;
            newThemeBtn.addEventListener('click', function() {
                addingNewTheme = !addingNewTheme;
                if (addingNewTheme) {
                    // Instead of hiding with display:none, use visibility or opacity
                    // to keep the element in the DOM for validation but visually hidden
                    themeSelect.style.visibility = 'hidden';
                    themeSelect.style.position = 'absolute';
                    themeSelect.style.width = '0';
                    themeSelect.style.height = '0';
                    themeSelect.style.padding = '0';
                    themeSelect.style.border = '0';
                    themeSelect.required = false; // Remove required attribute
                    
                    newThemeInput.style.display = 'block';
                    newThemeInput.required = true; // Add required to new input
                    
                    newThemeBtn.innerHTML = '<i class="fas fa-times"></i> Cancel';
                    newThemeBtn.classList.replace('btn-outline-primary', 'btn-outline-danger');
                } else {
                    // Restore the select element
                    themeSelect.style.visibility = 'visible';
                    themeSelect.style.position = 'static';
                    themeSelect.style.width = '';
                    themeSelect.style.height = '';
                    themeSelect.style.padding = '';
                    themeSelect.style.border = '';
                    themeSelect.required = true; // Restore required attribute
                    
                    newThemeInput.style.display = 'none';
                    newThemeInput.required = false; // Remove required from input
                    newThemeInput.value = '';
                    
                    newThemeBtn.innerHTML = '<i class="fas fa-plus"></i> New Theme';
                    newThemeBtn.classList.replace('btn-outline-danger', 'btn-outline-primary');
                }
            });

            // Load existing themes
            function loadThemes() {
                fetch('getZinnen.php?action=fetchThemas')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            themeSelect.innerHTML = '<option value="">Select a theme</option>';
                            data.themas.sort().forEach(theme => {
                                const option = document.createElement('option');
                                option.value = theme;
                                option.textContent = theme;
                                themeSelect.appendChild(option);
                            });
                        } else {
                            showError('Failed to load themes: ' + (data.error || 'Unknown error'));
                        }
                    })
                    .catch(error => {
                        showError('Error loading themes: ' + error.message);
                    });
            }

            // Preview functionality
            previewBtn.addEventListener('click', function() {
                const theme = addingNewTheme ? newThemeInput.value.trim() : themeSelect.value;
                const sentences = sentencesInput.value.trim().split('\n').filter(s => s.trim() !== '');
                
                if (!theme) {
                    showError('Please select or enter a theme');
                    return;
                }

                if (sentences.length === 0) {
                    showError('Please enter at least one sentence');
                    return;
                }

                previewTheme.textContent = theme;
                previewSentences.innerHTML = '';
                sentences.forEach(sentence => {
                    if (sentence.trim()) {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.textContent = sentence;
                        previewSentences.appendChild(div);
                    }
                });

                sentenceCount.textContent = sentences.length;
                previewContainer.style.display = 'block';
                
                // Hide any previous alerts
                successAlert.style.display = 'none';
                errorAlert.style.display = 'none';
            });

            // Form submission - updated to include userId
            addSentencesForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const theme = addingNewTheme ? newThemeInput.value.trim() : themeSelect.value;
                const sentences = sentencesInput.value.trim().split('\n').filter(s => s.trim() !== '');
                
                if (!theme) {
                    showError('Please select or enter a theme');
                    return;
                }

                if (sentences.length === 0) {
                    showError('Please enter at least one sentence');
                    return;
                }

                // Submit data to server with userId
                fetch('addZinnen.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        theme: theme,
                        sentences: sentences,
                        isNewTheme: addingNewTheme,
                        userId: UserLoggedId // Add userId from session
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showSuccess(`Successfully added ${data.added} sentences!`);
                        
                        // Reset form after successful submission
                        if (!addingNewTheme) {
                            themeSelect.value = '';
                        } else {
                            // Switch back to theme select and reload themes
                            newThemeBtn.click();
                            loadThemes();
                        }
                        sentencesInput.value = '';
                        previewContainer.style.display = 'none';
                    } else {
                        showError(data.error || 'Failed to add sentences');
                    }
                })
                .catch(error => {
                    showError('Error adding sentences: ' + error.message);
                });
            });

            // Helper functions for alerts
            function showSuccess(message) {
                successAlert.textContent = message;
                successAlert.style.display = 'block';
                errorAlert.style.display = 'none';
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    successAlert.style.display = 'none';
                }, 5000);
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorAlert.style.display = 'block';
                successAlert.style.display = 'none';
            }
            
            // Initial load
            loadThemes();
        });
    </script>
</body>
</html>
